name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CTEST_PARALLEL_LEVEL: "2"
  PYTHONUNBUFFERED: "1"

jobs:
  repository-checks:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check repository policy
        run: |
          mkdir -p out/logs
          python tools/check_repo.py 2>&1 | tee out/logs/repository-checks.log

      - name: Check agent coordination state
        run: python tools/agent_state.py check 2>&1 | tee out/logs/agent-state.log

      - name: Upload policy diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-policy-diagnostics
          path: out/logs/
          if-no-files-found: warn
          retention-days: 14

  native-unix:
    name: Native / ${{ matrix.compiler }} / Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cxx: g++
          - os: macos-15
            compiler: appleclang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Record toolchain versions
        run: |
          mkdir -p out/logs
          {
            python --version
            cmake --version
            ninja --version
            "$CXX" --version
          } 2>&1 | tee out/logs/toolchain.log

      - name: Configure Release
        run: cmake --preset release 2>&1 | tee out/logs/configure.log

      - name: Build Release
        run: cmake --build --preset release 2>&1 | tee out/logs/build.log

      - name: Run CTest
        run: >-
          ctest --preset release
          --output-junit "$GITHUB_WORKSPACE/out/logs/ctest.xml"
          2>&1 | tee out/logs/ctest.log

      - name: Verify installed runtime and relocated SDK
        run: >-
          python tools/package_smoke.py
          --build-dir out/build/release --config Release
          2>&1 | tee out/logs/package-smoke.log

      - name: Create foundation archives
        run: cpack --preset release 2>&1 | tee out/logs/cpack.log

      - name: Upload foundation archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-${{ matrix.compiler }}-release
          path: |
            out/build/release/packages/*.zip
            out/build/release/packages/*.tar.gz
            out/build/release/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.compiler }}-release-diagnostics
          path: |
            out/logs/
            out/build/release/Testing/Temporary/
            out/build/release/CMakeFiles/CMakeConfigureLog.yaml
            out/build/release/CMakeFiles/CMakeOutput.log
            out/build/release/CMakeFiles/CMakeError.log
            out/build/release/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

  native-windows:
    name: Native / MSVC / Release
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Record toolchain versions
        run: |
          New-Item -ItemType Directory -Path out/logs -Force | Out-Null
          python --version 2>&1 | Tee-Object -FilePath out/logs/python-version.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version 2>&1 | Tee-Object -FilePath out/logs/cmake-version.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The VS generator locates MSVC without a separate developer-shell action.
      - name: Configure Visual Studio 2022
        run: |
          cmake -S . -B out/build/msvc -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON -DGE_STRICT_WARNINGS=ON `
            -DGE_ENABLE_SANITIZERS=OFF -DGE_ENABLE_PACKAGING=ON `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/out/install/msvc" `
            2>&1 | Tee-Object -FilePath out/logs/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        run: |
          cmake --build out/build/msvc --config Release `
            2>&1 | Tee-Object -FilePath out/logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CTest
        run: |
          ctest --test-dir out/build/msvc -C Release --output-on-failure --no-tests=error `
            --output-junit "$env:GITHUB_WORKSPACE/out/logs/ctest.xml" `
            2>&1 | Tee-Object -FilePath out/logs/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed runtime and relocated SDK
        run: |
          python tools/package_smoke.py --build-dir out/build/msvc --config Release `
            2>&1 | Tee-Object -FilePath out/logs/package-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create foundation archives
        run: |
          cpack --config out/build/msvc/CPackConfig.cmake -C Release `
            2>&1 | Tee-Object -FilePath out/logs/cpack.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload foundation archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-msvc-release
          path: |
            out/build/msvc/packages/*.zip
            out/build/msvc/packages/*.tar.gz
            out/build/msvc/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-msvc-release-diagnostics
          path: |
            out/logs/
            out/build/msvc/Testing/Temporary/
            out/build/msvc/CMakeFiles/CMakeConfigureLog.yaml
            out/build/msvc/CMakeFiles/CMakeOutput.log
            out/build/msvc/CMakeFiles/CMakeError.log
            out/build/msvc/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

  sanitizers:
    name: GCC / ASan and UBSan / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CXX: g++
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Configure ASan and UBSan
        run: |
          mkdir -p out/logs
          cmake --preset asan 2>&1 | tee out/logs/configure.log

      - name: Build sanitizer configuration
        run: cmake --build --preset asan 2>&1 | tee out/logs/build.log

      - name: Run CTest with both sanitizers
        run: >-
          ctest --preset asan
          --output-junit "$GITHUB_WORKSPACE/out/logs/ctest.xml"
          2>&1 | tee out/logs/ctest.log

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcc-asan-ubsan-debug-diagnostics
          path: |
            out/logs/
            out/build/asan/Testing/Temporary/
            out/build/asan/CMakeFiles/CMakeConfigureLog.yaml
            out/build/asan/CMakeFiles/CMakeOutput.log
            out/build/asan/CMakeFiles/CMakeError.log
            out/build/asan/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
